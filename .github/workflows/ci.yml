name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: # Actions → CI → Run workflow: builds installers and publishes a release

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke-test the Electron app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          SNAPDROP_USER_DATA=$RUNNER_TEMP/ud SNAPDROP_SMOKE=$RUNNER_TEMP/smoke.png xvfb-run -a npx electron . --no-sandbox | tee smoke.log
          grep -q "SMOKE OK" smoke.log

  # Installers: push a tag (git tag v0.1.1 && git push --tags) or press “Run workflow” in Actions.
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: SnapDrop Desk ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          files: installers/*
          body: |
            ## Скачать

            | Система | Файл |
            |---|---|
            | **Windows** | `SnapDrop-Desk-*-win-x64.exe` — установщик · `*-win-portable.exe` — без установки |
            | **Mac (M1–M4)** | `SnapDrop-Desk-*-mac-arm64.dmg` |
            | **Mac (Intel)** | `SnapDrop-Desk-*-mac-x64.dmg` |
            | **Linux** | `.AppImage` или `.deb` |

            Телефонам ничего ставить не нужно — сканируйте QR-код в трее компьютера.

            **Первый запуск:** сборки не подписаны.
            Windows: «Windows защитил ваш компьютер» → *Подробнее* → *Выполнить в любом случае*; затем разрешите доступ в брандмауэре (частные сети).
            Mac: перетащите в «Программы», затем правый клик → *Открыть* → *Открыть*. Если пишет «повреждено»: `xattr -cr "/Applications/SnapDrop Desk.app"`.
